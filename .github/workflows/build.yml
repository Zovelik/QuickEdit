name: Build and package

# Every push to master is built and tested. A published release (or a manual
# run) also builds the packages: the installer and a zip for Windows, an
# AppImage for Linux; a release gets them as assets.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  VULKAN_SDK_VERSION: 1.4.313.0
  FFMPEG_RELEASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  FFMPEG_BUILD: ffmpeg-n8.1-latest
  VST3_SDK_TAG: v3.8.1_build_84
  WHISPER_TAG: v1.8.7

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Linux on an older Ubuntu (older glibc): the AppImage runs on more
        # distributions.
        os: [windows-latest, ubuntu-22.04]

    env:
      PACKAGE: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The CPack AppImage generator needs CMake 4.1 or newer.
      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.3.1"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      # DEPENDENCIES

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config ninja-build \
            libshaderc-dev \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libwayland-dev libdecor-0-dev liburing-dev libfribidi-dev

      # FFmpeg 8.1 LGPL, shared (the distributions have older ones).
      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ env.FFMPEG_BUILD }}-win64-lgpl-shared-8.1"
          Invoke-WebRequest "${{ env.FFMPEG_RELEASE }}/$name.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          New-Item -ItemType Directory -Force 3rdparty/ffmpeg | Out-Null
          Move-Item "ffmpeg-extract/$name" 3rdparty/ffmpeg/win64

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          name="${{ env.FFMPEG_BUILD }}-linux64-lgpl-shared-8.1"
          wget -q "${{ env.FFMPEG_RELEASE }}/$name.tar.xz"
          mkdir -p 3rdparty/ffmpeg
          tar -xf "$name.tar.xz" -C 3rdparty/ffmpeg
          mv "3rdparty/ffmpeg/$name" 3rdparty/ffmpeg/linux64
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/3rdparty/ffmpeg/linux64/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Download VST3 SDK and whisper.cpp
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ env.VST3_SDK_TAG }}" https://github.com/steinbergmedia/vst3sdk.git 3rdparty/vst3sdk
          git -C 3rdparty/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk
          git clone --depth 1 --branch "${{ env.WHISPER_TAG }}" https://github.com/ggml-org/whisper.cpp.git 3rdparty/whisper.cpp

      # BUILD AND TEST

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          -DFFMPEG_ROOT="${{ github.workspace }}/3rdparty/ffmpeg/linux64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      # PACKAGES

      # linuxdeploy and appimagetool, driven by CPack; appstreamcli lets
      # appimagetool check the AppStream data.
      - name: Install AppImage tools
        if: runner.os == 'Linux' && env.PACKAGE == 'true'
        run: |
          sudo apt-get install -y appstream
          sudo wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /usr/local/bin/linuxdeploy
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/appimagetool

      - name: Package
        if: env.PACKAGE == 'true'
        working-directory: build
        env:
          # linuxdeploy without FUSE on the runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cpack -C Release

      - name: Keep the packages
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QuickEdit-${{ runner.os }}
          path: |
            build/*.exe
            build/*.zip
            build/*.AppImage

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.exe
            build/*.zip
            build/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
